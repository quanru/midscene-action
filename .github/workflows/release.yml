name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release, e.g. 0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Tag release
        run: node scripts/release.mjs ${{ inputs.version }}
      - name: Push tags
        run: |
          git push origin "v${{ inputs.version }}"
          MAJOR="$(cut -d. -f1 <<< '${{ inputs.version }}')"
          git push origin "refs/tags/v${MAJOR}" --force
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --generate-notes
