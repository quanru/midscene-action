name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release, e.g. 0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Tag release
        run: node scripts/release.mjs ${{ inputs.version }}
      - name: Push tags
        run: |
          git push origin "v${{ inputs.version }}"
          MAJOR="$(cut -d. -f1 <<< '${{ inputs.version }}')"
          git push origin "refs/tags/v${MAJOR}" --force
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --generate-notes
