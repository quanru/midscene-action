name: Midscene Tests
description: Run caller commands, preserve native reports, and optionally deploy GitHub Pages.
inputs:
  working-directory:
    description: Caller-specified Midscene test project directory, used to run the command and collect reports.
    required: true
  command:
    description: Command to run the installed test suite.
    required: true
  artifact-name:
    description: Report artifact name; use unique names in a matrix.
    default: midscene-results
  retention-days:
    description: Raw report retention in days.
    default: '14'
  publish-pages:
    description: Set true to deploy native reports to GitHub Pages after testing.
    default: 'false'
outputs:
  report-artifact-name:
    description: Uploaded report name, or empty when no files were uploaded.
    value: ${{ steps.upload-results.outputs.artifact-id != '' && inputs.artifact-name || '' }}
  artifact-url:
    description: Uploaded artifact URL.
    value: ${{ steps.upload-results.outputs.artifact-url }}
  test-result:
    description: Test command step outcome.
    value: ${{ steps.test.outcome }}
  page-url:
    description: Deployed Pages URL, or empty when deployment did not succeed.
    value: ${{ steps.deployment.outputs.page_url }}
  publication-result:
    description: Deployment step outcome (success, failure, skipped, or cancelled).
    value: ${{ steps.deployment.outcome }}
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        TEST_DIRECTORY: ${{ inputs.working-directory }}
        PUBLISH_PAGES: ${{ inputs.publish-pages }}
      run: |
        if [[ -z "$TEST_DIRECTORY" ]]; then
          echo 'working-directory is required' >&2
          exit 1
        fi
        if [[ "$PUBLISH_PAGES" != true && "$PUBLISH_PAGES" != false ]]; then
          echo 'publish-pages must be true or false' >&2
          exit 1
        fi

    - name: Check GitHub Pages configuration
      id: pages
      if: ${{ inputs.publish-pages == 'true' }}
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      with:
        enablement: false

    - name: Explain unavailable Pages configuration
      if: ${{ failure() && steps.pages.outcome == 'failure' }}
      shell: bash
      run: |
        echo "::error::GitHub Pages check failed. A maintainer must select Settings > Pages > Build and deployment > Source > GitHub Actions. See the configure-pages log for configuration or permission errors."
        exit 1

    - name: Run all Midscene cases
      id: test
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TEST_COMMAND: ${{ inputs.command }}
      run: |
        if [[ -z "$TEST_COMMAND" ]]; then
          echo 'command is required' >&2
          exit 1
        fi
        bash -e -o pipefail -c "$TEST_COMMAND"

    - name: Upload Midscene test report
      id: upload-results
      if: ${{ always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.working-directory }}/midscene_run/
          ${{ inputs.working-directory }}/.midscene/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Write test results to Summary
      if: ${{ always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
      shell: bash
      env:
        TEST_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        {
          for result in "$TEST_DIRECTORY"/.midscene/test-results/*/result.md; do
            [ -f "$result" ] || continue
            sed '/^\[Open the Midscene Test report ↗\](/d' "$result"
            echo
          done
          echo "[Download test artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts)"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Find the latest published report artifact
      id: previous-report
      if: ${{ steps.pages.outcome == 'success' && steps.upload-results.outputs.artifact-id != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MIDSCENE_UPSTREAM_REPOSITORY: ${{ env.MIDSCENE_UPSTREAM_REPOSITORY || github.repository }}
      run: node "$GITHUB_ACTION_PATH/src/trusted-report-runs.mjs" find-previous

    - name: Download the latest published report
      if: ${{ steps.pages.outcome == 'success' && steps.upload-results.outputs.artifact-id != '' && steps.previous-report.outputs.run_id != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ steps.previous-report.outputs.name }}
        run-id: ${{ steps.previous-report.outputs.run_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/previous-pages-artifact

    - name: Extract the latest published report
      if: ${{ steps.pages.outcome == 'success' && steps.upload-results.outputs.artifact-id != '' && steps.previous-report.outputs.run_id != '' }}
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/previous-pages"
        tar -xf "$RUNNER_TEMP/previous-pages-artifact/artifact.tar" -C "$RUNNER_TEMP/previous-pages"

    - name: Prepare published report
      if: ${{ steps.pages.outcome == 'success' && steps.upload-results.outputs.artifact-id != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        node "$GITHUB_ACTION_PATH/src/prepare-pages-site.mjs" \
          --site "$RUNNER_TEMP/midscene-pages" \
          --reports "$PWD" \
          --run-id "$GITHUB_RUN_ID" \
          --previous "$RUNNER_TEMP/previous-pages"

    - name: Upload GitHub Pages report
      id: upload-pages
      if: ${{ steps.pages.outcome == 'success' && steps.upload-results.outputs.artifact-id != '' }}
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        name: midscene-e2e-report-pages-${{ github.run_attempt }}
        path: ${{ runner.temp }}/midscene-pages
        retention-days: 90

    - name: Deploy report to GitHub Pages
      id: deployment
      if: ${{ steps.upload-pages.outcome == 'success' }}
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      with:
        artifact_name: midscene-e2e-report-pages-${{ github.run_attempt }}

    - name: Add published report link to Summary
      if: ${{ steps.deployment.outcome == 'success' }}
      shell: bash
      env:
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
      run: |
        echo "[Open the Midscene Test report ↗](${PAGE_URL%/}/runs/$GITHUB_RUN_ID/)" >> "$GITHUB_STEP_SUMMARY"

    - name: Preserve command failure
      if: ${{ !cancelled() && steps.test.outcome == 'failure' }}
      shell: bash
      run: exit 1
