<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greeting example</title>
    <style>
      body {
        font: 24px system-ui;
        max-width: 600px;
        margin: 80px auto;
      }
      label,
      input,
      button {
        display: block;
        margin: 20px 0;
      }
      input,
      button {
        font: inherit;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Greeting example</h1>
    <form>
      <label for="name">Name</label>
      <input id="name" required />
      <button type="submit">Say hello</button>
    </form>
    <p id="greeting" aria-live="polite"></p>
    <script>
      document.querySelector('form').addEventListener('submit', (event) => {
        event.preventDefault();
        document.querySelector('#greeting').textContent =
          `Hello, ${document.querySelector('#name').value.trim()}!`;
      });
    </script>
  </body>
</html>
